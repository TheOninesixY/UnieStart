<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>UnieStart</title>
    <!-- SVG Favicon -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ffffff'%3E%3Cpath d='M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 14z'/%3E%3C/svg%3E">
    <!-- Google Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">

    <!-- 壁纸层 -->
    <div class="wallpaper-layer" id="wallpaperLayer"></div>

    <div class="glass-card">
        <!-- 纯文字毛玻璃透光问候语：绝无任何背景盒子 -->
        <div class="greeting-header" id="greetingHeader">
            <span class="greeting-title" id="greetingHeaderTitle">Good morning!</span>
        </div>

        <!-- 经典暗黑毛玻璃圆角搜索框 -->
        <div class="search-fusion">
            <input type="text" class="search-input-fusion" id="searchInput" placeholder="输入关键词或网址…" autofocus>
            <button class="search-btn-fusion" id="searchBtn">
                <span class="material-symbols-outlined">search</span>
                <span>搜索</span>
            </button>
        </div>

        <!-- 快捷磁贴网格 -->
        <div class="shortcuts-grid" id="shortcutsContainer"></div>
    </div>

    <!-- 放置于最下方的暗黑毛玻璃搜索引擎切换条 -->
    <div class="bottom-engine-container">
        <div class="desktop-capsule" id="desktopEngineSelector">
            <div class="nav-indicator" id="navIndicator"></div>
            <span class="engine-option active" data-engine="bing">必应</span>
            <span class="engine-option" data-engine="baidu">百度</span>
            <span class="engine-option" data-engine="sogou">搜狗</span>
            <span class="engine-option" data-engine="google">Google</span>
            <span class="engine-option" data-engine="yahoo">雅虎</span>
            <span class="engine-option" data-engine="bilibili">哔哩哔哩</span>
            <span class="engine-option" data-engine="duckduckgo">DuckDuckGo</span>
        </div>
    </div>

    <!-- 右键与长按快捷菜单 -->
    <div class="custom-context-menu" id="customContextMenu">
        <div class="menu-hover-indicator" id="menuHoverIndicator"></div>
        <div class="menu-item" id="menuSettings">
            <span class="material-symbols-outlined">settings</span>
            <span>设置</span>
        </div>
        <div class="menu-divider"></div>
        <div class="menu-item" id="menuReload">
            <span class="material-symbols-outlined">refresh</span>
            <span>刷新页面</span>
        </div>
        <div class="menu-item" id="menuDownloadBg">
            <span class="material-symbols-outlined">image</span>
            <span>下载背景</span>
        </div>
        <!-- 针对磁贴的专属项 -->
        <div class="menu-divider" id="menuTileDivider" style="display:none;"></div>
        <div class="menu-item" id="menuEditTile" style="display:none;">
            <span class="material-symbols-outlined">edit</span>
            <span>修改磁贴</span>
        </div>
        <div class="menu-item" id="menuDeleteTile" style="display:none; color:#f87171;">
            <span class="material-symbols-outlined" style="color:#f87171;">delete</span>
            <span>删除磁贴</span>
        </div>
    </div>

    <!-- 侧边栏设置抽屉 -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="settings-drawer" id="settingsDrawer">
        <div class="drawer-header">
            <h2>
                <span class="material-symbols-outlined">settings</span>
                <span>设置</span>
            </h2>
            <button class="drawer-close-btn" id="drawerCloseBtn">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <div class="drawer-content">
            <div class="drawer-group">
                <label class="drawer-label">外观主题</label>
                <select class="drawer-select" id="settingTheme">
                    <option value="dark">深色模式 (Dark)</option>
                    <option value="light">浅色模式 (Light)</option>
                    <option value="auto">跟随系统 (System Auto)</option>
                </select>
            </div>

            <div class="drawer-toggle-row">
                <span class="drawer-label">背景高斯模糊</span>
                <label class="switch">
                    <input type="checkbox" id="toggleBlur">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="drawer-toggle-row">
                <span class="drawer-label">显示问候语</span>
                <label class="switch">
                    <input type="checkbox" id="toggleGreeting" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="drawer-group">
                <label class="drawer-label">搜索结果打开方式</label>
                <select class="drawer-select" id="settingTarget">
                    <option value="_blank">在新标签页打开</option>
                    <option value="_self">在当前标签页打开</option>
                </select>
            </div>

            <div class="drawer-group">
                <label class="drawer-label">壁纸操作</label>
                <div class="drawer-btn-row">
                    <button class="drawer-btn" id="btnRefreshWallpaper">
                        <span class="material-symbols-outlined" style="font-size: 1.15rem;">refresh</span>
                        <span>刷新壁纸</span>
                    </button>
                    <button class="drawer-btn" id="btnDownloadWallpaper">
                        <span class="material-symbols-outlined" style="font-size: 1.15rem;">download</span>
                        <span>下载当前壁纸</span>
                    </button>
                </div>
            </div>

            <!-- 关于与 Fork 声明 -->
            <div class="drawer-about-card">
                <div><strong>UnieStart</strong></div>
                <div>项目制作人：<strong>OninesixY</strong></div>
                <div style="margin-top: 4px;">开源声明：本项目 Fork 自：<br>
                    <a href="https://github.com/CNFinder-Linux/F-sousuo" target="_blank" rel="noopener noreferrer">https://github.com/CNFinder-Linux/F-sousuo</a>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加/编辑快捷磁贴弹窗 -->
    <div class="modal-overlay" id="tileModal">
        <div class="modal-card">
            <div class="modal-title">
                <span class="material-symbols-outlined">add_link</span>
                <span id="tileModalTitle">添加快捷方式</span>
            </div>
            <div style="display:flex; flex-direction:column; gap:8px;">
                <label style="font-size:0.85rem; color:rgba(255,255,255,0.7);">名称</label>
                <input type="text" class="modal-input" id="tileName" placeholder="例如：GitHub">
            </div>
            <div style="display:flex; flex-direction:column; gap:8px;">
                <label style="font-size:0.85rem; color:rgba(255,255,255,0.7);">网址 (URL)</label>
                <input type="url" class="modal-input" id="tileUrl" placeholder="https://github.com">
            </div>
            <div class="modal-actions">
                <button class="btn-modal btn-cancel" id="tileCancelBtn">取消</button>
                <button class="btn-modal btn-save" id="tileSaveBtn">保存</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
